<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCM 转换器</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="app">
        <!-- 顶部工具栏 -->
        <div class="toolbar">
            <button id="addDirBtn" class="btn">
                <span class="icon">📁</span> 添加目录
            </button>
            <button id="addFileBtn" class="btn">
                <span class="icon">📄</span> 添加文件
            </button>
            <button id="addAppDirBtn" class="btn">
                <span class="icon">🏠</span> 程序目录
            </button>
            <div class="separator"></div>
            <button id="settingsBtn" class="btn">
                <span class="icon">⚙️</span> 设置
            </button>
            <button id="clearBtn" class="btn">
                <span class="icon">🗑️</span> 清空
            </button>
            <div class="separator"></div>
            <button id="startBtn" class="btn btn-primary">
                <span class="icon">▶️</span> 开始转码
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                <span class="icon">⏹️</span> 停止
            </button>
            <div class="spacer"></div>
            <span id="statusLabel" class="status">就绪</span>
        </div>

        <!-- 表格区域 -->
        <div class="table-container">
            <table id="fileTable">
                <thead>
                    <tr>
                        <th class="col-id">ID</th>
                        <th class="col-path">路径</th>
                        <th class="col-song">曲名</th>
                        <th class="col-format">格式</th>
                        <th class="col-size">大小</th>
                        <th class="col-cover">封面状态</th>
                        <th class="col-status">转码状态</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                </tbody>
            </table>
        </div>

        <!-- 日志区域 -->
        <div class="log-container">
            <div class="log-header">
                <span>日志</span>
                <span id="logFileInfo" class="log-file-info"></span>
            </div>
            <div id="logContent" class="log-content">
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button id="closeSettings" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoDownloadCover">
                        自动下载封面
                    </label>
                </div>
                <div class="form-group">
                    <label for="maxDownloadConcurrency">最大下载并发数</label>
                    <input type="number" id="maxDownloadConcurrency" min="1" max="20" value="3">
                </div>
                <div class="form-group">
                    <label for="maxConvertConcurrency">最大转码线程数</label>
                    <input type="number" id="maxConvertConcurrency" min="1" max="50" value="10">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="btn btn-primary">保存</button>
                <button id="cancelSettings" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>转换结果</h2>
                <button id="closeResult" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="result-stats">
                    <div class="result-item success">
                        <span class="result-count" id="successCount">0</span>
                        <span class="result-label">成功</span>
                    </div>
                    <div class="result-item skipped">
                        <span class="result-count" id="skippedCount">0</span>
                        <span class="result-label">跳过</span>
                    </div>
                    <div class="result-item failed">
                        <span class="result-count" id="failedCount">0</span>
                        <span class="result-label">失败</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="okResult" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="./src/main.js"></script>
</body>
</html>
